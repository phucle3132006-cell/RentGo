<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hồ sơ cá nhân – RentGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-base="" data-nav="profile">
  <div id="app-header"></div>
  <div class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Trang chủ</a> / Hồ sơ cá nhân</div>
      <h1>Hồ sơ cá nhân</h1>
    </div>
  </div>
  <main class="container">
    <p id="profileStatus" role="status">Đang tải hồ sơ…</p>
    <div id="profileForms" class="form-grid hidden">
      <section class="panel">
        <h2>Thông tin tài khoản</h2>
        <form id="profileForm">
          <div class="field"><label for="profileName">Họ và tên</label><input class="input" id="profileName" name="fullName" autocomplete="name" maxlength="100" required></div>
          <div class="field"><label for="profilePhone">Số điện thoại</label><input class="input" id="profilePhone" name="phone" type="tel" autocomplete="tel" maxlength="20" required></div>
          <div class="field"><label for="profileEmail">Email đăng nhập</label><input class="input" id="profileEmail" type="email" readonly aria-describedby="emailHelp"><small id="emailHelp" class="muted">Email đăng nhập chỉ có thể xem tại đây.</small></div>
          <p id="profileResult" role="status"></p>
          <button class="btn btn-coral" type="submit">Lưu thông tin</button>
        </form>
      </section>
      <section class="panel">
        <h2>Đổi mật khẩu</h2>
        <p class="muted">Mật khẩu mới cần từ 8 đến 128 ký tự. Sau khi đổi, hãy đăng nhập lại bằng mật khẩu mới.</p>
        <form id="passwordForm">
          <div class="field"><label for="currentPassword">Mật khẩu hiện tại</label><input class="input" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="1024" required></div>
          <div class="field"><label for="newPassword">Mật khẩu mới</label><input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
          <div class="field"><label for="confirmPassword">Nhập lại mật khẩu mới</label><input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" required></div>
          <p id="passwordResult" role="status"></p>
          <button class="btn btn-coral" type="submit">Đổi mật khẩu</button>
        </form>
      </section>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
