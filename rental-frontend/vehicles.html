<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><title>Danh sách xe – RentGo</title><link rel="stylesheet" href="css/style.css"></head>
<body data-base="" data-nav="all">
<div id="app-header"></div>
<div class="page-head"><div class="container"><div class="breadcrumb"><a href="index.html">Trang chủ</a> / Danh sách xe</div><h1 id="pageTitle">Tất cả xe cho thuê</h1></div></div>
<div class="container list-layout">
  <aside class="filters">
    <h3>Bộ lọc</h3>
    <div class="f-group"><label class="t">Tìm kiếm</label><input class="input" id="fQ" placeholder="Hãng, dòng xe, biển số..."></div>
    <div class="f-group"><label class="t">Loại xe</label>
      <div class="radio-list" id="fCat">
        <label><input type="radio" name="cat" value="" checked> Tất cả</label>
        <label><input type="radio" name="cat" value="OTO"> Ô tô</label>
        <label><input type="radio" name="cat" value="XE_SO"> Xe số</label>
        <label><input type="radio" name="cat" value="XE_GA"> Xe ga</label>
        <label><input type="radio" name="cat" value="XE_DIEN"> Xe điện</label>
      </div></div>
    <div class="f-group"><label class="t" for="fBrand">Hãng xe</label><select class="select" id="fBrand"><option value="">Tất cả hãng</option></select></div>
    <div class="f-group"><label class="t" for="fModel">Dòng xe</label><select class="select" id="fModel" disabled><option value="">Chọn hãng trước</option></select></div>
    <div class="f-group" id="fSeatsGroup"><label class="t" for="fSeats">Số chỗ ngồi</label><select class="select" id="fSeats"><option value="">Mọi số chỗ</option></select></div>
    <div class="f-group"><label class="t" for="fStart">Ngày nhận xe</label><input class="input" id="fStart" type="datetime-local"></div>
    <div class="f-group"><label class="t" for="fEnd">Ngày trả xe</label><input class="input" id="fEnd" type="datetime-local"></div>
    <p id="filterError" role="alert"></p>
    <div class="f-group"><label class="t" for="fPrice">Giá thuê</label><select class="select" id="fPrice"><option value="">Không giới hạn</option><option value="200000">200.000 ₫</option><option value="500000">500.000 ₫</option><option value="1000000">1.000.000 ₫</option></select></div>
    <div class="f-group"><div class="radio-list"><label><input type="checkbox" id="fAvail"> Chỉ xe sẵn sàng</label></div></div>
    <button class="btn btn-purple btn-block btn-sm" id="fApply">Áp dụng bộ lọc</button>
    <button class="btn btn-outline btn-block btn-sm" id="fReset">Xoá bộ lọc</button>
  </aside>
  <section>
    <div class="toolbar"><div id="count" class="muted" style="font-weight:700"></div>
      <select class="select" id="fSort"><option value="">Sắp xếp: Mặc định</option><option value="price_asc">Giá thấp → cao</option><option value="price_desc">Giá cao → thấp</option><option value="year_desc">Đời mới nhất</option></select></div>
    <div class="vgrid" id="grid"></div>
    <div class="pagination" id="pager"></div>
  </section>
</div>
<div id="app-footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/vehicles.js"></script>
</body></html>
