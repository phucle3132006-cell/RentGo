<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><title>Đăng ký – RentGo</title><link rel="stylesheet" href="css/style.css"></head>
<body data-base="">
<div id="app-header"></div>
<main class="auth-page"><div class="auth-card">
  <h1>Tạo tài khoản</h1><p class="sub">Đăng ký để thuê xe nhanh chóng.</p>
  <div id="msg"></div>
  <div class="field"><label>Họ và tên</label><input class="input" id="full_name" placeholder="Nguyễn Văn A"></div>
  <div class="field"><label>Email</label><input class="input" id="email" type="email" placeholder="email@example.com"></div>
  <div class="field"><label>Số điện thoại</label><input class="input" id="phone" type="tel" placeholder="0901234567"></div>
  <div class="field"><label>Mật khẩu</label><input class="input" id="password" type="password" placeholder="Tối thiểu 6 ký tự"></div>
  <div class="field"><label>Nhập lại mật khẩu</label><input class="input" id="password2" type="password"></div>
  <button class="btn btn-coral btn-block" id="btnReg">Đăng ký</button>
  <p class="foot">Đã có tài khoản? <a id="toLogin" href="login.html">Đăng nhập</a></p>
</div></main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body></html>
