<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><title>Đăng nhập – RentGo</title><link rel="stylesheet" href="css/style.css"></head>
<body data-base="">
<div id="app-header"></div>
<main class="auth-page"><div class="auth-card">
  <h1>Đăng nhập</h1><p class="sub">Chào mừng bạn quay lại RentGo.</p>
  <div id="msg"></div>
  <div class="field"><label>Email</label><input class="input" id="email" type="email" placeholder="email@example.com" autocomplete="username"></div>
  <div class="field"><label>Mật khẩu</label><input class="input" id="password" type="password" placeholder="••••••" autocomplete="current-password"></div>
  <button class="btn btn-coral btn-block" id="btnLogin">Đăng nhập</button>
  <p class="foot">Chưa có tài khoản? <a id="toReg" href="register.html">Đăng ký</a></p>
</div></main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body></html>
