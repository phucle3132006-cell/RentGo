<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><title>Đặt xe – RentGo</title><link rel="stylesheet" href="css/style.css"></head>
<body data-base="">
<div id="app-header"></div>
<div class="page-head"><div class="container"><div class="breadcrumb"><a href="index.html">Trang chủ</a> / Đặt xe</div><h1 id="pageTitle">Giỏ thuê xe &amp; đặt lịch</h1></div></div>
<div class="container">
  <div class="stepper"><div class="s active" id="st1"><i>1</i>Chọn xe &amp; thời gian</div><div class="s" id="st2"><i>2</i>Tạo đơn</div><div class="s"><i>3</i>Thanh toán</div></div>
  <div class="two-col">
    <div>
      <div class="panel" style="margin-top:0"><h2>Xe đã chọn</h2><div id="items"></div><a class="btn btn-outline btn-sm" href="vehicles.html" style="margin-top:12px">+ Thêm xe khác</a></div>
      <div class="panel"><h2>Thời gian thuê</h2>
        <p class="muted" style="margin-bottom:12px">Tất cả xe trong cùng một đơn dùng chung thời gian nhận – trả.</p>
        <div class="form-grid"><div class="field"><label>Nhận xe</label><input type="datetime-local" class="input" id="dStart"></div><div class="field"><label>Trả xe</label><input type="datetime-local" class="input" id="dEnd"></div>
        <div class="field full"><label>Ghi chú</label><textarea class="textarea" id="note" placeholder="VD: Nhận xe buổi sáng"></textarea></div></div></div>
    </div>
    <aside class="book-card">
      <h2 style="font-size:22px;margin-bottom:10px">Tóm tắt</h2>
      <div class="sum-row"><span>Số xe</span><b id="sCount">0</b></div>
      <div class="sum-row"><span>Số ngày (ước tính)</span><b id="sDays">—</b></div>
      <div class="sum-row total"><span>Tạm tính</span><span id="sTotal">—</span></div>
      <p class="muted" style="font-size:13px;margin:6px 0 12px">Số tiền chính thức do hệ thống tính khi tạo đơn.</p>
      <div id="availMsg"></div>

      <button class="btn btn-coral btn-block" id="btnCreate" style="margin-top:10px" disabled>Tạo đơn &amp; Thanh toán</button>
    </aside>
  </div>
</div>
<div id="app-footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/booking.js"></script>
</body></html>
